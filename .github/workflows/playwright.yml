name: Playwright CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  test:
    name: Smoke Tests
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Create Authentication State
        run: npm run auth:setup
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          STANDARD_USERNAME: ${{ secrets.STANDARD_USERNAME }}
          STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
          LOCKED_OUT_USERNAME: ${{ secrets.LOCKED_OUT_USERNAME }}
          PROBLEM_USERNAME: ${{ secrets.PROBLEM_USERNAME }}
          PERFORMANCE_GLITCH_USERNAME: ${{ secrets.PERFORMANCE_GLITCH_USERNAME }}
          ERROR_USERNAME: ${{ secrets.ERROR_USERNAME }}
          VISUAL_USERNAME: ${{ secrets.VISUAL_USERNAME }}
          INVALID_USERNAME: ${{ secrets.INVALID_USERNAME }}
          INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}

      - name: Verify Authentication State
        run: |
          echo "Checking authentication state..."
          test -f auth/user.json
          echo "Authentication state created successfully."

      - name: Run Smoke Tests
        run: npx playwright test --grep @smoke --project=chromium --no-deps
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          STANDARD_USERNAME: ${{ secrets.STANDARD_USERNAME }}
          STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
          LOCKED_OUT_USERNAME: ${{ secrets.LOCKED_OUT_USERNAME }}
          PROBLEM_USERNAME: ${{ secrets.PROBLEM_USERNAME }}
          PERFORMANCE_GLITCH_USERNAME: ${{ secrets.PERFORMANCE_GLITCH_USERNAME }}
          ERROR_USERNAME: ${{ secrets.ERROR_USERNAME }}
          VISUAL_USERNAME: ${{ secrets.VISUAL_USERNAME }}
          INVALID_USERNAME: ${{ secrets.INVALID_USERNAME }}
          INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Setup GitHub Pages
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Report for GitHub Pages
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

  deploy:
    name: Deploy Playwright Report

    if: github.ref == 'refs/heads/main'

    needs: test

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:

      - name: Deploy Report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4